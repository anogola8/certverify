{% extends "base.html" %}
{% block title %}Sign In — CertVerify{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg rounded-4 mt-5">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="fa-solid fa-shield-halved text-success display-4 mb-3"></i>
            <h3 class="fw-bold">Issuer Login</h3>
            <p class="text-muted">Sign in to manage your institution's ledger.</p>
          </div>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-bold">Username</label>
              <input type="text" name="username" class="form-control form-control-lg" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Password</label>
              <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill">Sign In</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
