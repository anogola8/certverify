{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | CertVerify Admin{% endblock %}

{% block branding %}
<div class="d-flex align-items-center">
    <i class="fa-solid fa-shield-halved text-success me-2 fs-4"></i>
    <h1 id="site-name" class="mb-0 fw-bold">
        <a href="{% url 'admin:index' %}" class="text-decoration-none text-dark">CertVerify Administration</a>
    </h1>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/fontawesome/all.min.css">
<link rel="stylesheet" href="/static/css/icons.css">
<style>
    :root {
        --primary: #0f172a;
        --secondary: #10b981;
        --accent: #10b981;
    }
    #header { background: #ffffff; border-bottom: 2px solid #e2e8f0; color: #0f172a; }
    #branding h1, #branding h1 a:link, #branding h1 a:visited { color: #0f172a; }
    div.breadcrumbs { background: #f8fafc; color: #475569; border-bottom: 1px solid #e2e8f0; }
    .module h2, .module caption, .inline-group h2 { background: #10b981; color: white; }
    .button, input[type=submit], input[type=button], .submit-row input, a.button { background: #10b981; color: white; border-radius: 4px; font-weight: bold; padding: 10px 15px; }
    .button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover, a.button:hover { background: #059669; }
    .button.default, input[type=submit].default, .submit-row input.default { background: #0f172a; }
    .button.default:hover, input[type=submit].default:hover, .submit-row input.default:hover { background: #1e293b; }
    #nav-sidebar { background: #f8fafc; }
    .current-app .section:link, .current-app .section:visited { color: #0f172a; }
</style>
{% endblock %}
